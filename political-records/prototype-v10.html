<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>시차 — 오늘의 정치, 기록과 함께</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="./assets/v10.css">
</head>
<body>
<header class="appbar">
  <div class="appbar-in">
    <button class="brand" onclick="go('today')">시차</button>
    <div class="app-actions">
      <button class="round" aria-label="검색" onclick="openSearch()">⌕</button>
      <button class="round avatar-me" aria-label="내 활동" onclick="openMy()">나</button>
    </div>
  </div>
</header>

<div class="search-layer" id="searchLayer">
  <div class="search-top">
    <button class="back" onclick="closeSearch()">←</button>
    <input id="globalSearch" placeholder="인물, 이슈, 발언 검색" autocomplete="off">
  </div>
  <div class="search-results" id="searchResults"></div>
</div>

<main>
  <section class="screen on" id="screen-today">
    <div class="hero-copy">
      <b id="todayDate">오늘</b>
      <h1>지금, 왜 시끄러운지.</h1>
      <p>사진으로 보고 · 쟁점을 읽고 · 원문까지 확인.</p>
    </div>
    <div class="today-feed" id="todayFeed"></div>
  </section>

  <section class="screen" id="screen-talk">
    <div class="page-head">
      <div><h1>토론</h1><p>이슈별로 보고, 말하고, 근거를 붙여요.</p></div>
      <button class="primary-small" onclick="openComposer()">글쓰기</button>
    </div>
    <div class="room-strip" id="roomStrip"></div>
    <div class="talk-toolbar">
      <button class="on" data-talksort="new" onclick="setTalkSort('new')">최신</button>
      <button data-talksort="reply" onclick="setTalkSort('reply')">댓글 많은 글</button>
    </div>
    <div class="post-feed" id="postFeed"></div>
  </section>

  <section class="screen" id="screen-people">
    <div class="page-head">
      <div><h1>인물</h1><p>밖으로 나가지 않고 여기서 끝까지.</p></div>
    </div>
    <div class="people-search">
      <input id="peopleSearch" placeholder="이름, 정당, 지역구 검색">
    </div>
    <div class="people-featured" id="peopleFeatured"></div>
    <div class="people-state" id="peopleState"></div>
    <div class="people-list" id="peopleList"></div>
  </section>
</main>

<nav class="nav">
  <button class="on" data-nav="today" onclick="go('today')"><i>●</i><span>오늘</span></button>
  <button data-nav="talk" onclick="go('talk')"><i>◌</i><span>토론</span></button>
  <button data-nav="people" onclick="go('people')"><i>◎</i><span>인물</span></button>
</nav>

<div class="scrim" id="scrim" onclick="if(event.target===this)closeSheet()"><article class="sheet" id="sheet"></article></div>
<div class="toast" id="toast"></div>

<script src="./assets/v10.js"></script>
</body>
</html>
